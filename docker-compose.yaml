version: "3.9"

services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyterlab
    image: a3_car_jupyter:latest
    ports:
      - "8889:8888"
    volumes:
      - ./code:/root/code
    env_file:
      - .env
    working_dir: /root/code
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --allow-root
      - --notebook-dir=/root/code
      - --ServerApp.token='' # disable token
      - --ServerApp.password='' # disable password
      - --no-browser
    networks:
      - car-network

  dash:
    build:
      context: .
      dockerfile: Dockerfile
    image: a3_car_price:latest
    ports:
      - "8060:80"
    volumes:
      - ./code:/root/code
      - ./_mlflow/mlruns:/mlflow/mlruns
    env_file:
      - .env
    working_dir: /root/code
    command: ["python3", "/root/code/app.py"]
    networks:
      - car-network

networks:
  car-network:
    driver: bridge
